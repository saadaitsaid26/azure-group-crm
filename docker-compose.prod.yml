services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: crm_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-crm}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network
    restart: unless-stopped

  # Redis Cache/Broker
  redis:
    image: redis:7-alpine
    container_name: crm_redis_prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network
    restart: unless-stopped

  # Django Backend API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: crm_api_prod
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn crm_backend.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:3000 --workers 4"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://${DB_USER:-app}:${DB_PASSWORD}@db:5432/${DB_NAME:-crm}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=crm_backend.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: crm_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - web_dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - crm_network
    restart: unless-stopped

  # Frontend Build (one-time build)
  web-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
    container_name: crm_web_build
    volumes:
      - web_dist:/app/dist
    environment:
      - VITE_API_URL=${VITE_API_URL}
    command: npm run build

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  web_dist:

networks:
  crm_network:
    driver: bridge
