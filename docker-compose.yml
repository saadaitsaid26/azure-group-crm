services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: crm_db
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # Redis Cache/Broker
  redis:
    image: redis:7-alpine
    container_name: crm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # Django Backend API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: crm_api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_test_users &&
             gunicorn crm_backend.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:3000 --reload"
    volumes:
      - ./api:/app
      - static_volume:/app/staticfiles
    ports:
      - "3000:3000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production-12345
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      - DATABASE_URL=postgresql://app:app@db:5432/crm
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080,http://localhost:3000
      - CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://localhost:8080,http://localhost:3000
      - COOKIE_DOMAIN=
      - DJANGO_SETTINGS_MODULE=crm_backend.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm_network

  # Vite Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: crm_web
    command: npm run dev -- --host 0.0.0.0 --port 8080
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
    depends_on:
      - api
    networks:
      - crm_network

volumes:
  postgres_data:
  redis_data:
  static_volume:

networks:
  crm_network:
    driver: bridge
